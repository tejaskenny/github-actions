name: Greet User

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Who do you want to greet?'
        required: true
        default: 'World'

jobs:
  greet:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run greet script
      run: |
        python greet.py "${{ github.event.inputs.username }}"

